name: build-ios-fastlane

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: '可选的构建号（build number）覆盖。TestFlight 每次上传必须比上一次大，留空则用 pubspec.yaml 的 +xxxx'
        required: false
        default: ''

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BOARD_SDK_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Build Go Core & Precache iOS
        run: |
          make core-ios
          flutter precache --ios

      - name: Install CocoaPods
        run: |
          cd ios && pod install && cd ..
          test -d ios/Runner.xcworkspace || { echo "ERROR: pod install 未生成 Runner.xcworkspace"; exit 1; }

      - name: Setup Code Signing
        run: |
          # 创建专用钥匙串
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain

          # 导入 iPhone Distribution 证书
          echo "${{ secrets.IOS_CERTIFICATE }}" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain \
            -P "${{ secrets.IOS_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k temp build.keychain

          # 安装仓库中的 Provisioning Profiles（无需 secrets），按每个 profile 内嵌的 UUID 命名
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          main_uuid=$(grep -a -A1 '<key>UUID</key>' ios/ToWorld.mobileprovision | grep -a '<string>' | sed 's/.*<string>//;s/<\/string>.*//')
          pkt_uuid=$(grep -a -A1 '<key>UUID</key>' ios/ToWorldPacketTunnel.mobileprovision | grep -a '<string>' | sed 's/.*<string>//;s/<\/string>.*//')
          cp ios/ToWorld.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/${main_uuid}.mobileprovision
          cp ios/ToWorldPacketTunnel.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/${pkt_uuid}.mobileprovision
          echo "MAIN_PROFILE_UUID=$main_uuid" >> "$GITHUB_ENV"
          echo "PKT_PROFILE_UUID=$pkt_uuid" >> "$GITHUB_ENV"
          echo "[signing] profiles installed ($main_uuid, $pkt_uuid)"

      - name: Build & Export IPA
        # 原生 xcodebuild：先无签名 archive，再手动签名 export。
        # 不用 gym build_app——它会同时把 CODE_SIGNING_ALLOWED=NO 传给 export 导致卡死。
        run: |
          BN_ARGS=""
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            # Info.plist 的 CFBundleVersion 直接引用 $(FLUTTER_BUILD_NUMBER)，所以要覆盖它
            BN_ARGS="FLUTTER_BUILD_NUMBER=${{ github.event.inputs.build_number }} CURRENT_PROJECT_VERSION=${{ github.event.inputs.build_number }}"
          fi

          # Archive：直接手动签名（CODE_SIGN_STYLE=Manual，Xcode 按 bundle id 自动匹配已安装的 profile）。
          # 不能用 CODE_SIGNING_ALLOWED=NO —— 那会跳过 codesign，entitlements 就不会嵌入，
          # 之后 export 重新签名也不会补 entitlement，上传会被 App Store 拒绝。
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/ios/Runner.xcarchive \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            $BN_ARGS \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=9ZKNBU3VL4 \
            archive

          # ExportOptions.plist（manual 签名 + 按 UUID 匹配，profile 名每次重建会变）
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>9ZKNBU3VL4</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>uk.toworld.flclash</key>
                  <string>${MAIN_PROFILE_UUID}</string>
                  <key>uk.toworld.flclash.PacketTunnel</key>
                  <string>${PKT_PROFILE_UUID}</string>
              </dict>
          </dict>
          </plist>
          PLIST

          # Export（手动签名；export 阶段绝不能带 CODE_SIGNING_ALLOWED=NO，否则会卡死）
          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportPath dist/ \
            -exportOptionsPlist ExportOptions.plist

          # 重命名 IPA
          mv dist/Runner.ipa dist/ToWorld-ios-arm64.ipa 2>/dev/null || \
          mv dist/fl_clash.ipa dist/ToWorld-ios-arm64.ipa 2>/dev/null || \
          { ls -la dist/; echo "ERROR: 找不到 IPA"; exit 1; }

      - name: Deploy to TestFlight
        env:
          CI: 'true'
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
        run: |
          bundle exec fastlane deploy_testflight --verbose

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-ios-fastlane
          path: ./dist/ToWorld-ios-arm64.ipa
          overwrite: true
