name: build-ios-fastlane

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BOARD_SDK_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Setup Code Signing
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          IOS_PACKETTUNNEL_PROFILE: ${{ secrets.IOS_PACKETTUNNEL_PROFILE }}
        run: |
          # 创建专用钥匙串
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain

          # 导入 iPhone Distribution 证书
          echo "${{ secrets.IOS_CERTIFICATE }}" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain \
            -P "${{ secrets.IOS_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k temp build.keychain

          # 安装 ToWorld Provisioning Profiles
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles
          mkdir -p ~/private_keys

          set +e
          python3 -c "
import base64, os, plistlib
def install(label, env_var):
    b64 = os.environ.get(env_var, '')
    if not b64:
        print(f'[signing] WARNING: empty secret {label}')
        return
    try:
        data = base64.b64decode(b64.strip())
    except Exception as e:
        print(f'[signing] WARNING: base64 decode failed for {label}: {e}, len={len(b64)}')
        return
    with open('/tmp/p.mobileprovision', 'wb') as f:
        f.write(data)
    try:
        uuid = plistlib.loads(data)['UUID']
        name = plistlib.loads(data)['Name']
    except Exception as e:
        print(f'[signing] WARNING: plist parse failed for {label}: {e}, size={len(data)}')
        return
    import shutil
    for d in [os.path.expanduser('~/Library/MobileDevice/Provisioning Profiles'),
              os.path.expanduser('~/Library/Developer/Xcode/UserData/Provisioning Profiles')]:
        os.makedirs(d, exist_ok=True)
        shutil.copy('/tmp/p.mobileprovision', os.path.join(d, f'{uuid}.mobileprovision'))
    print(f'[signing] installed {label}: {uuid} ({name})')
install('ToWorld', 'IOS_PROVISIONING_PROFILE')
install('ToWorldPacketTunnel', 'IOS_PACKETTUNNEL_PROFILE')
"
          set -e

          # App Store Connect API Key
          echo "${{ secrets.ASC_API_KEY }}" > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Build & Export IPA
        run: |
          make core-ios
          flutter precache --ios

          cd ios && pod install && cd ..
          test -d ios/Runner.xcworkspace || { echo "ERROR: pod install 未生成 Runner.xcworkspace"; exit 1; }

          # Archive（不签名）
          echo "[xcodebuild] archiving without signing"
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -archivePath build/ios/Runner.xcarchive \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            archive

          # Export（Manual 签名 + ToWorld profiles）
          echo "[debug] profiles on disk before export:"
          echo "  MobileDevice:"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ 2>/dev/null || echo "    (empty)"
          echo "  UserData:"
          ls -la ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/ 2>/dev/null || echo "    (empty)"
          echo "[debug] profile names:"
          for f in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            [ -f "$f" ] && echo "  $(basename $f): $(security cms -D -i "$f" 2>/dev/null | plutil -extract Name raw -o - -)"
          done

          echo "[xcodebuild] exporting with manual signing"
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>9ZKNBU3VL4</string>
              <key>signingCertificate</key>
              <string>iOS Distribution</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>uk.toworld.flclash</key>
                  <string>ToWorld</string>
                  <key>uk.toworld.flclash.PacketTunnel</key>
                  <string>ToWorldPacketTunnel</string>
              </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportPath dist/ \
            -exportOptionsPlist ExportOptions.plist

          # 重命名 IPA
          mv dist/Runner.ipa dist/FlClash-ios-arm64.ipa 2>/dev/null || \
          mv dist/fl_clash.ipa dist/FlClash-ios-arm64.ipa 2>/dev/null || \
          { ls -la dist/; echo "ERROR: 找不到 IPA"; exit 1; }

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app -f dist/FlClash-ios-arm64.ipa \
            --apiKey ${{ secrets.ASC_KEY_ID }} \
            --apiIssuer ${{ secrets.ASC_ISSUER_ID }} \
            --type ios

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-ios-fastlane
          path: ./dist/FlClash-ios-arm64.ipa
          overwrite: true
