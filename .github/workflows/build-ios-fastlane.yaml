name: build-ios-fastlane

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: '签名构建并上传 TestFlight'
        type: boolean
        default: false
      build_number:
        description: '可选 build number；留空使用 pubspec，上传时须大于已有构建号'
        required: false
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.context.outputs.tag }}
      publish: ${{ steps.context.outputs.publish }}
      commit: ${{ steps.context.outputs.commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BOARD_SDK_PAT || secrets.GITHUB_TOKEN }}

      - name: Resolve release context and pinned tools
        id: context
        env:
          UPLOAD_TESTFLIGHT: ${{ inputs.upload_testflight }}
          BUILD_NUMBER_INPUT: ${{ inputs.build_number }}
        run: python3 tool/distribution/release_tools.py context

      - name: Test release tooling
        run: python3 -m unittest discover -s tool/distribution/tests -v

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Setup Ruby
        if: steps.context.outputs.publish == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Precache iOS
        run: |
          flutter precache --ios

      - name: Install CocoaPods
        run: |
          cd ios && pod install && cd ..
          test -d ios/Runner.xcworkspace || { echo "ERROR: pod install 未生成 Runner.xcworkspace"; exit 1; }

      - name: Fetch pinned CA certificates
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | shasum -a 256 -c -

      - name: Verify unsigned iOS build
        if: steps.context.outputs.publish != 'true'
        run: bash ios/scripts/build_ios.sh verify --env pre --build-number "$IOS_BUILD_NUMBER" -v

      - name: Resolve bundle identifiers
        if: steps.context.outputs.publish == 'true'
        run: |
          APP_ID=$(xcodebuild -showBuildSettings -project ios/Runner.xcodeproj -target Runner -sdk iphoneos -configuration Release 2>/dev/null | awk -F' = ' '$1 ~ /^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER$/ {print $2; exit}')
          PKT_ID=$(xcodebuild -showBuildSettings -project ios/Runner.xcodeproj -target PacketTunnel -sdk iphoneos -configuration Release 2>/dev/null | awk -F' = ' '$1 ~ /^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER$/ {print $2; exit}')
          GROUP_APP=$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' ios/Runner/Runner.entitlements)
          GROUP_PKT=$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' ios/PacketTunnel/PacketTunnel.entitlements)
          [ -n "$APP_ID" ] && [ -n "$PKT_ID" ] || { echo "ERROR: 解析 bundle id 失败 (APP_ID=$APP_ID PKT_ID=$PKT_ID)"; exit 1; }
          [ "$GROUP_APP" = "$GROUP_PKT" ] || { echo "ERROR: 主 App 与 PacketTunnel 的 App Group 不一致: $GROUP_APP vs $GROUP_PKT"; exit 1; }
          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"
          echo "PKT_ID=$PKT_ID" >> "$GITHUB_ENV"
          echo "APP_GROUP=$GROUP_APP" >> "$GITHUB_ENV"
          echo "[ids] APP_ID=$APP_ID PKT_ID=$PKT_ID GROUP=$GROUP_APP"

      - name: Setup Code Signing
        if: steps.context.outputs.publish == 'true'
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain

          echo "$IOS_CERTIFICATE" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain \
            -P "$IOS_CERTIFICATE_PASSWORD" -A
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k temp build.keychain

          security list-keychains -d user -s build.keychain
          security unlock-keychain -p temp build.keychain
          security set-keychain-settings -lut 21600 build.keychain

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles
          main_uuid=$(grep -a -A1 '<key>UUID</key>' ios/ToWorld.mobileprovision | grep -a '<string>' | sed 's/.*<string>//;s/<\/string>.*//')
          pkt_uuid=$(grep -a -A1 '<key>UUID</key>' ios/ToWorldPacketTunnel.mobileprovision | grep -a '<string>' | sed 's/.*<string>//;s/<\/string>.*//')
          cp ios/ToWorld.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/${main_uuid}.mobileprovision
          cp ios/ToWorld.mobileprovision ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/${main_uuid}.mobileprovision
          cp ios/ToWorldPacketTunnel.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/${pkt_uuid}.mobileprovision
          cp ios/ToWorldPacketTunnel.mobileprovision ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/${pkt_uuid}.mobileprovision
          echo "MAIN_PROFILE_UUID=$main_uuid" >> "$GITHUB_ENV"
          echo "PKT_PROFILE_UUID=$pkt_uuid" >> "$GITHUB_ENV"
          echo "[signing] profiles installed ($main_uuid, $pkt_uuid)"

      - name: Enforce Manual signing specifiers
        if: steps.context.outputs.publish == 'true'
        run: |
          set -euo pipefail
          [ -n "$APP_ID" ] && [ -n "$PKT_ID" ] || { echo "ERROR: bundle ids missing"; exit 1; }
          [ -n "$MAIN_PROFILE_UUID" ] && [ -n "$PKT_PROFILE_UUID" ] || { echo "ERROR: profile UUIDs missing"; exit 1; }
          awk -v app="$APP_ID" -v pkt="$PKT_ID" -v main="$MAIN_PROFILE_UUID" -v pktuuid="$PKT_PROFILE_UUID" '
            /\/\* Release \*\/ = \{/ { is_release = 1 }
            /buildSettings = {/ { if (is_release) { in_block = 1; block = $0 "\n"; next } }
            in_block {
              block = block $0 "\n"
              if ($0 ~ /^[[:space:]]*};/) {
                if (block ~ /PROVISIONING_PROFILE_SPECIFIER/) {
                  gsub(/CODE_SIGN_IDENTITY = "Apple Development";/, "CODE_SIGN_IDENTITY = \"Apple Distribution\";", block)
                  gsub(/CODE_SIGN_STYLE = Automatic;/, "CODE_SIGN_STYLE = Manual;", block)
                  if (index(block, "PRODUCT_BUNDLE_IDENTIFIER = " pkt ";") > 0) {
                    gsub(/PROVISIONING_PROFILE_SPECIFIER = "[^"]*";/, "PROVISIONING_PROFILE_SPECIFIER = \"" pktuuid "\";", block)
                  } else if (index(block, "PRODUCT_BUNDLE_IDENTIFIER = " app ";") > 0) {
                    gsub(/PROVISIONING_PROFILE_SPECIFIER = "[^"]*";/, "PROVISIONING_PROFILE_SPECIFIER = \"" main "\";", block)
                  }
                }
                printf "%s", block
                in_block = 0; is_release = 0; block = ""
                next
              }
              next
            }
            { print }
          ' ios/Runner.xcodeproj/project.pbxproj > /tmp/pbx.enforced
          [ -s /tmp/pbx.enforced ] || { echo "ERROR: awk 输出为空，未覆盖 pbxproj"; exit 1; }
          mv /tmp/pbx.enforced ios/Runner.xcodeproj/project.pbxproj
          grep -n 'CODE_SIGN_STYLE\|PROVISIONING_PROFILE_SPECIFIER' ios/Runner.xcodeproj/project.pbxproj

      - name: Build & Export IPA
        if: steps.context.outputs.publish == 'true'
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>9ZKNBU3VL4</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${APP_ID}</key>
                  <string>${MAIN_PROFILE_UUID}</string>
                  <key>${PKT_ID}</key>
                  <string>${PKT_PROFILE_UUID}</string>
              </dict>
          </dict>
          </plist>
          PLIST

          WATCHDOG_INTERVAL=20
          ATTEMPT_BUDGET=1200

          build_processes() {
            ps -axo pid=,ppid=,comm= | awk -v root="$BUILD_PID" '
              { parents[$1]=$2; commands[$1]=$3 }
              END {
                for (pid in parents) {
                  current=pid
                  while (current in parents && current != root && current > 1) current=parents[current]
                  if (current == root) print pid, commands[pid]
                }
              }'
          }

          start_watchdog() {
            (
              prev_codesign=""
              waited=0
              while true; do
                sleep $WATCHDOG_INTERVAL
                waited=$((waited + WATCHDOG_INTERVAL))
                cur_codesign=$(build_processes | awk '$2 ~ /(^|\/)codesign$/ {print $1}' | sort | tr '\n' ' ')
                if [ -n "$cur_codesign" ] && [ "$cur_codesign" = "$prev_codesign" ]; then
                  echo "=== codesign（pid $cur_codesign）跨过 ${WATCHDOG_INTERVAL}s 仍在，判定挂死 ==="
                  ps -o pid,etime,stat,command -p $cur_codesign || true
                  for signing_pid in $cur_codesign; do
                    sample "$signing_pid" 2 -mayDie 2>&1 | sed -n '1,60p' || true
                  done
                  echo "--- 钥匙串 ---"
                  security list-keychains || true
                  security default-keychain || true
                  security find-identity -v -p codesigning || true
                  echo "=== 杀掉它（不退出：xcodebuild 可能换 pid 重试）==="
                  for signing_pid in $cur_codesign; do
                    kill -9 "$signing_pid" 2>/dev/null || true
                  done
                  prev_codesign=""
                  continue
                fi
                prev_codesign="$cur_codesign"
                if [ "$waited" -ge "$ATTEMPT_BUDGET" ]; then
                  echo "=== 本次尝试已 ${waited}s，兜底杀掉 ==="
                  build_processes | while read -r child_pid child_command; do
                    kill "$child_pid" 2>/dev/null || true
                  done
                  exit 0
                fi
              done
            ) &
            WATCHDOG=$!
          }

          verify_keychain() {
            printf canary > /tmp/codesign-canary
            identity=$(security find-identity -v -p codesigning build.keychain \
              | grep -m1 'Apple Distribution' | awk '{print $2}')
            if [ -z "$identity" ]; then
              echo "ERROR: build.keychain 里没有 Apple Distribution 身份" >&2
              exit 1
            fi
            echo "[canary] codesign --force --sign $identity --timestamp /tmp/codesign-canary"
            codesign --force --sign "$identity" --timestamp /tmp/codesign-canary &
            CANARY_PID=$!
            waited=0
            while kill -0 "$CANARY_PID" 2>/dev/null; do
              sleep 2
              waited=$((waited + 2))
              if [ "$waited" -ge 20 ]; then
                echo "=== canary 20 秒未返回：这台 runner 的钥匙串授权不可用 ==="
                ps -o pid,etime,stat,command -p "$CANARY_PID" || true
                sample "$CANARY_PID" 2 -mayDie 2>&1 | sed -n '1,50p' || true
                security list-keychains || true
                security default-keychain || true
                security find-identity -v -p codesigning || true
                kill -9 "$CANARY_PID" 2>/dev/null || true
                echo "=== 这不是构建问题，重试同一台机器没有意义：重新派发本 workflow 即可 ==="
                exit 1
              fi
            done
            wait "$CANARY_PID" || {
              echo "ERROR: canary 签名失败" >&2
              exit 1
            }
            codesign -dv /tmp/codesign-canary 2>&1 | head -3
            echo "[canary] ok"
          }

          security unlock-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security find-identity -v -p codesigning build.keychain | tail -5

          verify_keychain

          BUILD_RC=0
          bash ios/scripts/build_ios.sh archive --env stable --export-options-plist ExportOptions.plist --build-number "$IOS_BUILD_NUMBER" -v &
          BUILD_PID=$!
          start_watchdog
          trap 'kill "$WATCHDOG" 2>/dev/null || true' EXIT
          wait "$BUILD_PID" || BUILD_RC=$?
          kill "$WATCHDOG" 2>/dev/null || true

          [ "$BUILD_RC" -eq 0 ] || exit "$BUILD_RC"

      - name: Save iOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-ios-arm64
          path: ./dist/
          if-no-files-found: error
          overwrite: true

  testflight:
    needs: build-ios
    if: needs.build-ios.outputs.publish == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ needs.build-ios.outputs.tag }}
      SOURCE_COMMIT: ${{ needs.build-ios.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: artifact-ios-arm64
          path: dist
      - name: Verify the signed artifact
        run: python3 tool/distribution/release_tools.py validate-ios --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT"
      - name: Deploy to TestFlight
        env:
          CI: 'true'
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
        run: |
          export IPA_PATH="$PWD/dist/ToWorld-${RELEASE_TAG#v}-ios-arm64.ipa"
          bundle exec fastlane deploy_testflight --verbose
