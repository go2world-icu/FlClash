name: build-ios-fastlane

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: '可选的构建号（build number）覆盖。TestFlight 每次上传必须比上一次大，留空则用 pubspec.yaml 的 +xxxx'
        required: false
        default: ''

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BOARD_SDK_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Build Go Core & Precache iOS
        run: |
          make core-ios
          flutter precache --ios

      - name: Install CocoaPods
        run: |
          cd ios && pod install && cd ..
          test -d ios/Runner.xcworkspace || { echo "ERROR: pod install 未生成 Runner.xcworkspace"; exit 1; }

      - name: Setup Code Signing
        run: |
          # 创建专用钥匙串
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain

          # 导入 iPhone Distribution 证书
          echo "${{ secrets.IOS_CERTIFICATE }}" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain \
            -P "${{ secrets.IOS_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k temp build.keychain

          # 安装仓库中的 Provisioning Profiles（无需 secrets），按每个 profile 内嵌的 UUID 命名
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          for p in ios/ToWorld.mobileprovision ios/ToWorldPacketTunnel.mobileprovision; do
            uuid=$(grep -a -A1 '<key>UUID</key>' "$p" | grep -a '<string>' | sed 's/.*<string>//;s/<\/string>.*//')
            cp "$p" ~/Library/MobileDevice/Provisioning\ Profiles/${uuid}.mobileprovision
          done
          echo "[signing] profiles installed from repo ($(ls ~/Library/MobileDevice/Provisioning\ Profiles/ | wc -l) files)"

      - name: Deploy to TestFlight
        env:
          CI: 'true'
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            ARGS="build_number:${{ github.event.inputs.build_number }}"
          fi
          bundle exec fastlane deploy_testflight $ARGS --verbose

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-ios-fastlane
          path: ./dist/FlClash-ios-arm64.ipa
          overwrite: true
