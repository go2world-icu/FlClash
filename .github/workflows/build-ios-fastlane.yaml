name: build-ios-fastlane

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: '可选的构建号（build number）覆盖。TestFlight 每次上传必须比上一次大，留空则用 pubspec.yaml 的 +xxxx'
        required: false
        default: ''

env:
  # 必须跟 build.yaml 的 FLUTTER_VERSION / GO_VERSION 一致：上游升工具链时不会碰到
  # 这个文件（它不存在于上游），钉住的版本会悄悄落后。Go 尤其硬——core/go.mod 的
  # `go 1.27.0` 会让 1.26 的 toolchain 现去下载一个新版本。
  FLUTTER_VERSION: '3.47.6'
  GO_VERSION: '1.27.1'

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BOARD_SDK_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Precache iOS
        run: |
          flutter precache --ios

      - name: Install CocoaPods
        run: |
          cd ios && pod install && cd ..
          test -d ios/Runner.xcworkspace || { echo "ERROR: pod install 未生成 Runner.xcworkspace"; exit 1; }

      - name: Resolve bundle identifiers
        # bundle id / App Group 单一数据源 = Xcode 工程（pbxproj + entitlements）。
        # Xcode 里改完，CI 自动跟随，不再硬编码在 workflow / ExportOptions 里。
        run: |
          APP_ID=$(xcodebuild -showBuildSettings -project ios/Runner.xcodeproj -target Runner -sdk iphoneos -configuration Release 2>/dev/null | awk -F' = ' '$1 ~ /^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER$/ {print $2; exit}')
          PKT_ID=$(xcodebuild -showBuildSettings -project ios/Runner.xcodeproj -target PacketTunnel -sdk iphoneos -configuration Release 2>/dev/null | awk -F' = ' '$1 ~ /^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER$/ {print $2; exit}')
          GROUP_APP=$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' ios/Runner/Runner.entitlements)
          GROUP_PKT=$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.application-groups:0' ios/PacketTunnel/PacketTunnel.entitlements)
          [ -n "$APP_ID" ] && [ -n "$PKT_ID" ] || { echo "ERROR: 解析 bundle id 失败 (APP_ID=$APP_ID PKT_ID=$PKT_ID)"; exit 1; }
          [ "$GROUP_APP" = "$GROUP_PKT" ] || { echo "ERROR: 主 App 与 PacketTunnel 的 App Group 不一致: $GROUP_APP vs $GROUP_PKT"; exit 1; }
          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"
          echo "PKT_ID=$PKT_ID" >> "$GITHUB_ENV"
          echo "APP_GROUP=$GROUP_APP" >> "$GITHUB_ENV"
          echo "[ids] APP_ID=$APP_ID PKT_ID=$PKT_ID GROUP=$GROUP_APP"

      - name: Setup Code Signing
        run: |
          # 创建专用钥匙串
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain

          # 导入 iPhone Distribution 证书。
          #
          # 用 -A（any application may use the key）而不是 -T /usr/bin/codesign：
          # codesign 卡死那几次，栈都停在 CSSM_GetKeyAcl —— 也就是 ACL 在问「这个
          # 进程能不能用这把私钥」，而 CI 上没人能点那个授权框。-T 只授权那一个二进制，
          # 可发起签名的其实是 SWBBuildService 拉起来的 codesign；分区列表按理覆盖得到，
          # 但实测仍会间歇性挂住（同一配方两次成功、两次挂死）。runner 是一次性的，
          # 放宽到 -A 的代价可以接受。
          echo "${{ secrets.IOS_CERTIFICATE }}" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain \
            -P "${{ secrets.IOS_CERTIFICATE_PASSWORD }}" -A
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k temp build.keychain

          # 搜索列表显式写上，并在 import 之后再解锁一次：codesign 读私钥 ACL 时若
          # 判定需要授权，会弹一个 CI 上没人能点的窗口，然后永远等下去
          # （sample 里就是卡在 CSSM_GetKeyAcl）。macOS 26 的 runner 上这一步不
          # 保险，所以把顺序补全、构建前再确认一次。
          security list-keychains -d user -s build.keychain
          security unlock-keychain -p temp build.keychain

          # 安装仓库中的 Provisioning Profiles（无需 secrets），按每个 profile 内嵌的 UUID 命名。
          # 两处都装：MobileDevice 给 codesign/export，UserData 给 Xcode 的 GatherProvisioningInputs。
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles
          main_uuid=$(grep -a -A1 '<key>UUID</key>' ios/ToWorld.mobileprovision | grep -a '<string>' | sed 's/.*<string>//;s/<\/string>.*//')
          pkt_uuid=$(grep -a -A1 '<key>UUID</key>' ios/ToWorldPacketTunnel.mobileprovision | grep -a '<string>' | sed 's/.*<string>//;s/<\/string>.*//')
          cp ios/ToWorld.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/${main_uuid}.mobileprovision
          cp ios/ToWorld.mobileprovision ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/${main_uuid}.mobileprovision
          cp ios/ToWorldPacketTunnel.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/${pkt_uuid}.mobileprovision
          cp ios/ToWorldPacketTunnel.mobileprovision ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/${pkt_uuid}.mobileprovision
          echo "MAIN_PROFILE_UUID=$main_uuid" >> "$GITHUB_ENV"
          echo "PKT_PROFILE_UUID=$pkt_uuid" >> "$GITHUB_ENV"
          echo "[signing] profiles installed ($main_uuid, $pkt_uuid)"

      - name: Enforce Manual signing specifiers
        # 保险：本地调试可能把 pbxproj 的 Release 配置误改成 Automatic/空 profile
        # （f476904 曾因此导致 TestFlight 找不到 profile）。构建前强制设回
        # Manual + 当前 profile UUID。按每个 Release buildSettings 块里的
        # PRODUCT_BUNDLE_IDENTIFIER 区分主 App / PacketTunnel，不依赖文件顺序。
        run: |
          set -euo pipefail
          [ -n "$APP_ID" ] && [ -n "$PKT_ID" ] || { echo "ERROR: bundle ids missing"; exit 1; }
          [ -n "$MAIN_PROFILE_UUID" ] && [ -n "$PKT_PROFILE_UUID" ] || { echo "ERROR: profile UUIDs missing"; exit 1; }
          awk -v app="$APP_ID" -v pkt="$PKT_ID" -v main="$MAIN_PROFILE_UUID" -v pktuuid="$PKT_PROFILE_UUID" '
            /\/\* Release \*\/ = \{/ { is_release = 1 }
            /buildSettings = {/ { if (is_release) { in_block = 1; block = $0 "\n"; next } }
            in_block {
              block = block $0 "\n"
              if ($0 ~ /^[[:space:]]*};/) {
                if (block ~ /PROVISIONING_PROFILE_SPECIFIER/) {
                  gsub(/CODE_SIGN_IDENTITY = "Apple Development";/, "CODE_SIGN_IDENTITY = \"Apple Distribution\";", block)
                  gsub(/CODE_SIGN_STYLE = Automatic;/, "CODE_SIGN_STYLE = Manual;", block)
                  if (index(block, "PRODUCT_BUNDLE_IDENTIFIER = " pkt ";") > 0) {
                    gsub(/PROVISIONING_PROFILE_SPECIFIER = "[^"]*";/, "PROVISIONING_PROFILE_SPECIFIER = \"" pktuuid "\";", block)
                  } else if (index(block, "PRODUCT_BUNDLE_IDENTIFIER = " app ";") > 0) {
                    gsub(/PROVISIONING_PROFILE_SPECIFIER = "[^"]*";/, "PROVISIONING_PROFILE_SPECIFIER = \"" main "\";", block)
                  }
                }
                printf "%s", block
                in_block = 0; is_release = 0; block = ""
                next
              }
              next
            }
            { print }
          ' ios/Runner.xcodeproj/project.pbxproj > /tmp/pbx.enforced
          [ -s /tmp/pbx.enforced ] || { echo "ERROR: awk 输出为空，未覆盖 pbxproj"; exit 1; }
          mv /tmp/pbx.enforced ios/Runner.xcodeproj/project.pbxproj
          grep -n 'CODE_SIGN_STYLE\|PROVISIONING_PROFILE_SPECIFIER' ios/Runner.xcodeproj/project.pbxproj

      - name: Build & Export IPA
        # 统一入口：dart setup.dart ios —— 内部负责 make core-ios + flutter build ipa。
        # 签名：cert/profile 已由 Setup Code Signing 装好，pbxproj 是 Manual + profile UUID，
        # export 用下面这个 ExportOptions.plist（manual 签名 + 按 UUID 匹配）。
        run: |
          # ExportOptions.plist（manual 签名 + 按 UUID 匹配，profile 名每次重建会变）
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>9ZKNBU3VL4</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>${APP_ID}</key>
                  <string>${MAIN_PROFILE_UUID}</string>
                  <key>${PKT_ID}</key>
                  <string>${PKT_PROFILE_UUID}</string>
              </dict>
          </dict>
          </plist>
          PLIST

          BN=""
          if [ -n "${{ github.event.inputs.build_number }}" ]; then
            BN="--build-number=${{ github.event.inputs.build_number }}"
          fi

          # codesign 卡死时 flutter 会把 xcodebuild 的输出全缓冲住，日志里一个字都没有，
          # job 只能干等到 60 分钟超时——什么都学不到。看门狗到点抓栈、打钥匙串状态，
          # 然后杀掉构建，让这一步快速失败并留下可诊断的信息。
          (
            sleep 720
            echo "=== 构建超过 12 分钟，判定为挂死，开始取证 ==="
            for name in codesign xcodebuild; do
              for p in $(pgrep -x "$name" || true); do
                echo "--- $name pid=$p ---"
                ps -o pid,etime,stat,command -p "$p" || true
                sample "$p" 2 -mayDie 2>&1 | sed -n '1,60p' || true
              done
            done
            echo "--- 钥匙串 ---"
            security list-keychains || true
            security default-keychain || true
            security find-identity -v -p codesigning || true
            echo "=== 杀掉挂死的构建 ==="
            pkill -x codesign || true
            pkill -x xcodebuild || true
          ) &
          WATCHDOG=$!

          # 签名前最后确认一次：解锁 + 搜索列表 + 默认钥匙串，并检查身份确实在场。
          security unlock-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security find-identity -v -p codesigning build.keychain | tail -5

          # 统一入口：setup.dart 负责 make core-ios + flutter build ipa（含签名/export）
          dart setup.dart ios --env stable --export-options-plist ExportOptions.plist $BN -v
          BUILD_RC=$?
          kill "$WATCHDOG" 2>/dev/null || true
          [ "$BUILD_RC" -eq 0 ] || exit "$BUILD_RC"

          # 重命名 IPA（flutter build ipa 输出到 build/ios/ipa/）
          mkdir -p dist
          mv build/ios/ipa/*.ipa dist/ToWorld-ios-arm64.ipa 2>/dev/null || \
          { ls -la build/ios/ipa/; echo "ERROR: 找不到 IPA"; exit 1; }

      - name: Deploy to TestFlight
        env:
          CI: 'true'
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
        run: |
          bundle exec fastlane deploy_testflight --verbose

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-ios-fastlane
          path: ./dist/ToWorld-ios-arm64.ipa
          overwrite: true
