name: build-ios

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BOARD_SDK_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Setup Code Signing
        run: |
          # 创建专用钥匙串
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain

          # 导入 Distribution 证书（带私钥）
          echo "${{ secrets.IOS_CERTIFICATE }}" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain \
            -P "${{ secrets.IOS_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k temp build.keychain

          # 安装描述文件（UUID 命名）
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p ~/private_keys

          echo "${{ secrets.IOS_PROVISIONING_PROFILE }}" | base64 --decode > app-profile.mobileprovision
          APP_PROFILE_UUID=$(plutil -extract UUID raw -o - app-profile.mobileprovision 2>/dev/null) || \
          APP_PROFILE_UUID=$(grep -aA1 '<key>UUID</key>' app-profile.mobileprovision | \
            tail -1 | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
          APP_PROFILE_NAME=$(plutil -extract Name raw -o - app-profile.mobileprovision 2>/dev/null) || \
          APP_PROFILE_NAME=$(grep -aA1 '<key>Name</key>' app-profile.mobileprovision | \
            tail -1 | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
          [ -n "$APP_PROFILE_UUID" ] && cp app-profile.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/$APP_PROFILE_UUID.mobileprovision
          [ -n "$APP_PROFILE_NAME" ] && echo "$APP_PROFILE_NAME" > ~/private_keys/app_profile_name.txt

          echo "${{ secrets.IOS_PACKETTUNNEL_PROFILE }}" | base64 --decode > packettunnel-profile.mobileprovision
          PACKET_TUNNEL_PROFILE_UUID=$(plutil -extract UUID raw -o - packettunnel-profile.mobileprovision 2>/dev/null) || \
          PACKET_TUNNEL_PROFILE_UUID=$(grep -aA1 '<key>UUID</key>' packettunnel-profile.mobileprovision | \
            tail -1 | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
          PACKET_TUNNEL_PROFILE_NAME=$(plutil -extract Name raw -o - packettunnel-profile.mobileprovision 2>/dev/null) || \
          PACKET_TUNNEL_PROFILE_NAME=$(grep -aA1 '<key>Name</key>' packettunnel-profile.mobileprovision | \
            tail -1 | sed 's/.*<string>\(.*\)<\/string>.*/\1/')
          [ -n "$PACKET_TUNNEL_PROFILE_UUID" ] && cp packettunnel-profile.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/$PACKET_TUNNEL_PROFILE_UUID.mobileprovision
          [ -n "$PACKET_TUNNEL_PROFILE_NAME" ] && echo "$PACKET_TUNNEL_PROFILE_NAME" > ~/private_keys/packettunnel_profile_name.txt

          test -s ~/private_keys/app_profile_name.txt || { echo "ERROR: 无法解析主应用描述文件名"; exit 1; }
          test -s ~/private_keys/packettunnel_profile_name.txt || { echo "ERROR: 无法解析 PacketTunnel 描述文件名"; exit 1; }

          echo "[signing] installed provisioning profiles:"
          ls -1 ~/Library/MobileDevice/Provisioning\ Profiles || true
          echo "[signing] app profile name: $(cat ~/private_keys/app_profile_name.txt)"
          echo "[signing] packet tunnel profile name: $(cat ~/private_keys/packettunnel_profile_name.txt)"
          echo "[signing] expected bundle ids: uk.toworld.flclash, uk.toworld.flclash.PacketTunnel"

          echo "[signing] app profile details:"
          security cms -D -i app-profile.mobileprovision > /tmp/app-profile.plist
          plutil -extract Entitlements.application-identifier raw /tmp/app-profile.plist
          plutil -extract Entitlements xml1 -o - /tmp/app-profile.plist | sed -n '1,80p'

          echo "[signing] packet tunnel profile details:"
          security cms -D -i packettunnel-profile.mobileprovision > /tmp/packettunnel-profile.plist
          plutil -extract Entitlements.application-identifier raw /tmp/packettunnel-profile.plist
          plutil -extract Entitlements xml1 -o - /tmp/packettunnel-profile.plist | sed -n '1,80p'

          # API 密钥（上传 TestFlight 用）
          mkdir -p ~/private_keys
          echo "${{ secrets.ASC_API_KEY }}" > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Build iOS
        run: |
          make core-ios
          flutter precache --ios

          cd ios && pod install && cd ..
          test -d ios/Runner.xcworkspace || { echo "ERROR: pod install 未生成 Runner.xcworkspace"; exit 1; }

          # Archive（Automatic 签名 — 让 Xcode 自动匹配已安装的 profile）
          echo "[xcodebuild] starting archive with automatic signing"
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/Runner.xcarchive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=9ZKNBU3VL4 \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            -allowProvisioningUpdates \
            archive

          # 导出 IPA
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>9ZKNBU3VL4</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>uk.toworld.flclash</key>
                  <string>iOS Team Store Provisioning Profile: uk.toworld.flclash</string>
                  <key>uk.toworld.flclash.PacketTunnel</key>
                  <string>iOS Team Store Provisioning Profile: uk.toworld.flclash.PacketTunnel</string>
              </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportPath dist/ \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates

          # 重命名 IPA
          mv dist/Runner.ipa dist/FlClash-ios-arm64.ipa 2>/dev/null || \
          mv dist/fl_clash.ipa dist/FlClash-ios-arm64.ipa 2>/dev/null || \
          { ls -la dist/; echo "ERROR: 找不到 IPA"; exit 1; }

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app -f dist/FlClash-ios-arm64.ipa \
            --apiKey ${{ secrets.ASC_KEY_ID }} \
            --apiIssuer ${{ secrets.ASC_ISSUER_ID }} \
            --type ios

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-ios
          path: ./dist/FlClash-ios-arm64.ipa
          overwrite: true
