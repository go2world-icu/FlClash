name: build-ios

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.BOARD_SDK_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: |
            core/go.sum

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Setup Code Signing
        run: |
          # 创建专用钥匙串
          security create-keychain -p temp build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p temp build.keychain

          # 导入 Development 证书（archive 用）
          echo "${{ secrets.IOS_DEVELOPMENT_CERTIFICATE }}" | base64 --decode > dev-cert.p12
          security import dev-cert.p12 -k build.keychain \
            -P "${{ secrets.IOS_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign

          # 导入 Distribution 证书（export 用）
          echo "${{ secrets.IOS_CERTIFICATE }}" | base64 --decode > dist-cert.p12
          security import dist-cert.p12 -k build.keychain \
            -P "${{ secrets.IOS_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k temp build.keychain

          # 安装描述文件到两个路径
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          mkdir -p ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles
          mkdir -p ~/private_keys

          install_profile() {
            local b64="$1"
            [ -z "$b64" ] && return
            echo "$b64" | base64 --decode > /tmp/tmp-profile.mobileprovision 2>/dev/null || return
            local uuid=$(plutil -extract UUID raw -o - /tmp/tmp-profile.mobileprovision 2>/dev/null)
            [ -z "$uuid" ] && return
            cp /tmp/tmp-profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$uuid.mobileprovision
            cp /tmp/tmp-profile.mobileprovision ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/$uuid.mobileprovision
            echo "[signing] installed $uuid ($(plutil -extract Name raw -o - /tmp/tmp-profile.mobileprovision 2>/dev/null))"
          }

          install_profile "${{ secrets.IOS_DEVELOPMENT_PROFILE }}"
          install_profile "${{ secrets.IOS_PROVISIONING_PROFILE }}"
          install_profile "${{ secrets.IOS_DEVELOPMENT_PACKETTUNNEL_PROFILE }}"
          install_profile "${{ secrets.IOS_PACKETTUNNEL_PROFILE }}"

          echo "[signing] all installed provisioning profiles:"
          ls -1 ~/Library/MobileDevice/Provisioning\ Profiles || true
          echo ""
          ls -1 ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles || true

          # API 密钥（上传 TestFlight 用）
          mkdir -p ~/private_keys
          echo "${{ secrets.ASC_API_KEY }}" > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Build iOS
        run: |
          make core-ios
          flutter precache --ios

          cd ios && pod install && cd ..
          test -d ios/Runner.xcworkspace || { echo "ERROR: pod install 未生成 Runner.xcworkspace"; exit 1; }

          # Archive（Automatic 签名 — 需要 Dev cert + Dev profile）
          echo "[xcodebuild] keychain identities:"
          security find-identity -v -p codesigning build.keychain || true
          echo "[xcodebuild] starting archive"
          xcodebuild -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ios/Runner.xcarchive \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM=9ZKNBU3VL4 \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            -allowProvisioningUpdates \
            -authenticationKeyPath $HOME/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            archive

          # 导出 IPA
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>9ZKNBU3VL4</string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/ios/Runner.xcarchive \
            -exportPath dist/ \
            -exportOptionsPlist ExportOptions.plist

          # 重命名 IPA
          mv dist/Runner.ipa dist/FlClash-ios-arm64.ipa 2>/dev/null || \
          mv dist/fl_clash.ipa dist/FlClash-ios-arm64.ipa 2>/dev/null || \
          { ls -la dist/; echo "ERROR: 找不到 IPA"; exit 1; }

      - name: Upload to TestFlight
        run: |
          xcrun altool --upload-app -f dist/FlClash-ios-arm64.ipa \
            --apiKey ${{ secrets.ASC_KEY_ID }} \
            --apiIssuer ${{ secrets.ASC_ISSUER_ID }} \
            --type ios

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-ios
          path: ./dist/FlClash-ios-arm64.ipa
          overwrite: true
