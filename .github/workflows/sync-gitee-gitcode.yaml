name: sync-gitee-gitcode

# 手动同步 GitHub Release 到 Gitee 和 GitCode（含附件）。
# 原逻辑在 build.yaml 里被注释，现独立成 workflow，需要时手动跑一次。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要同步的 GitHub tag（release），留空则用最新 release'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(curl -s "https://api.github.com/repos/go2world-icu/FlClash/releases/latest" \
              | grep -o '"tag_name":"[^"]*"' | head -1 | cut -d'"' -f4)
          fi
          [ -z "$TAG" ] && { echo "ERROR: 无法解析 tag"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          git checkout -q "$TAG" 2>/dev/null || { git fetch -q origin tag "$TAG"; git checkout -q "$TAG"; }

      - name: Download release assets
        run: |
          mkdir -p dist
          cd dist
          urls=$(curl -s "https://api.github.com/repos/go2world-icu/FlClash/releases/tags/$TAG" \
            | grep -o '"browser_download_url":"[^"]*"' | sed 's/.*"browser_download_url":"//;s/"$//')
          [ -z "$urls" ] && echo "WARNING: $TAG 没有附件"
          echo "$urls" | while read -r url; do
            [ -z "$url" ] && continue
            echo "Downloading $url"
            curl -sL -O "$url"
          done
          ls -la

      - name: Sync release to Gitee
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          API="https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO"

          # 创建 Gitee Release（已存在则忽略）
          echo "Creating Gitee release $TAG..."
          RESP=$(curl -sS -X POST "$API/releases" \
            -H "Content-Type: application/json" \
            -d "{\"access_token\":\"$GITEE_TOKEN\",\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"ToWorld $TAG\",\"target_commitish\":\"master\"}")
          echo "Create response: $RESP" | head -c 500

          # 获取 release_id
          RELEASE_ID=$(echo "$RESP" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          if [ -z "$RELEASE_ID" ]; then
            # 尝试从已有 release 获取
            RELEASE_ID=$(curl -s "$API/releases/tags/$TAG?access_token=$GITEE_TOKEN" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          fi
          [ -z "$RELEASE_ID" ] && { echo "Failed to get release ID"; exit 1; }
          echo "Release ID: $RELEASE_ID"

          # 上传每个文件
          for file in dist/*; do
            [ -f "$file" ] || continue
            echo "Uploading $(basename $file)..."
            curl -s -X POST "$API/releases/$RELEASE_ID/attach_files" \
              -F "access_token=$GITEE_TOKEN" \
              -F "file=@$file" > /dev/null
          done
          echo "Sync to Gitee complete"

      - name: Sync release to GitCode
        continue-on-error: true
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_OWNER: ${{ secrets.GITCODE_OWNER }}
          GITCODE_REPO: ${{ secrets.GITCODE_REPO }}
          GITCODE_BRANCH: main
        run: |
          API="https://api.gitcode.com/api/v5/repos/$GITCODE_OWNER/$GITCODE_REPO"
          AUTH="Authorization: Bearer $GITCODE_TOKEN"

          # 1. 推送分支和 tag 到 GitCode（空仓库也保证 tag 存在）
          git remote remove gitcode 2>/dev/null || true
          git remote add gitcode "https://oauth2:$GITCODE_TOKEN@gitcode.com/$GITCODE_OWNER/$GITCODE_REPO.git"
          git push -q gitcode "HEAD:refs/heads/$GITCODE_BRANCH" 2>&1 | tail -1 || true
          git push -q gitcode "refs/tags/$TAG:refs/tags/$TAG" --force 2>&1 | tail -1
          git remote remove gitcode 2>/dev/null || true

          # 2. 创建或更新 Release（已存在则 PATCH 更新）
          EXISTING=$(curl -sS -H "$AUTH" "$API/releases/tags/$TAG")
          if echo "$EXISTING" | grep -q '"id"'; then
            RELEASE_ID=$(echo "$EXISTING" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
            echo "Release $TAG exists (id=$RELEASE_ID), updating..."
            curl -sS -X PATCH "$API/releases/$RELEASE_ID" \
              -H "$AUTH" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"ToWorld $TAG\"}" > /dev/null
          else
            echo "Creating GitCode release $TAG..."
            RESP=$(curl -sS -X POST "$API/releases" \
              -H "$AUTH" -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"ToWorld $TAG\",\"target_commitish\":\"$GITCODE_BRANCH\"}")
            echo "Create response: $RESP" | head -c 500
          fi

          # 3. 获取 release_id
          RELEASE_ID=$(curl -sS -H "$AUTH" "$API/releases/tags/$TAG" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          [ -z "$RELEASE_ID" ] && { echo "Failed to get release ID"; exit 1; }
          echo "Release ID: $RELEASE_ID"

          # 4. 上传附件
          for file in dist/*; do
            [ -f "$file" ] || continue
            FNAME=$(basename "$file")
            ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$FNAME")
            echo "Getting upload URL for $FNAME..."
            UPLOAD_INFO=$(curl -sS -H "$AUTH" "$API/releases/$TAG/upload_url?file_name=$ENC")
            UPLOAD_URL=$(echo "$UPLOAD_INFO" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('url',''))" 2>/dev/null)
            if [ -z "$UPLOAD_URL" ]; then
              echo "Failed to get upload URL for $FNAME, skipping"
              continue
            fi
            # 应用上传接口返回的请求头
            echo "$UPLOAD_INFO" | python3 -c "
            import sys, json
            d = json.load(sys.stdin)
            for k, v in (d.get('headers') or {}).items():
                print(f'{k}: {v}')
            " > /tmp/gitcode_headers.txt
            echo "Uploading $FNAME..."
            if [ -s /tmp/gitcode_headers.txt ]; then
              curl -sS -X PUT "$UPLOAD_URL" -H @/tmp/gitcode_headers.txt --data-binary "@$file" > /dev/null
            else
              curl -sS -X PUT "$UPLOAD_URL" --data-binary "@$file" > /dev/null
            fi
          done
          echo "Sync to GitCode complete"
