  # 同步到 Gitee：与 GitCode 并行，失败不影响整体流程，可手动同步
  sync-gitee:
    if: ${{ !contains(github.ref, '-') }}
    needs: [ upload ]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Sync release to Gitee
        env:
          TAG: ${{ github.ref_name }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
          GITEE_REPO: ${{ secrets.GITEE_REPO }}
        run: |
          API="https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO"

          # 创建 Gitee Release（已存在则忽略）
          echo "Creating Gitee release $TAG..."
          RESP=$(curl -sS -X POST "$API/releases" \
            -H "Content-Type: application/json" \
            -d "{\"access_token\":\"$GITEE_TOKEN\",\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"ToWorld $TAG\",\"target_commitish\":\"master\"}")
          echo "Create response: $RESP" | head -c 500

          # 获取 release_id
          RELEASE_ID=$(echo "$RESP" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          if [ -z "$RELEASE_ID" ]; then
            # 尝试从已有 release 获取
            RELEASE_ID=$(curl -s "$API/releases/tags/$TAG?access_token=$GITEE_TOKEN" | grep -o '"id":[0-9]*' | head -1 | cut -d: -f2)
          fi
          [ -z "$RELEASE_ID" ] && { echo "Failed to get release ID"; exit 1; }
          echo "Release ID: $RELEASE_ID"

          # 上传每个文件
          MAX_SIZE_MB=50
          for file in dist/*; do
            [ -f "$file" ] || continue
            FNAME=$(basename "$file")
            SIZE_MB=$(( $(stat -c%s "$file") / 1048576 ))
            if [ "$SIZE_MB" -gt "$MAX_SIZE_MB" ]; then
              echo "跳过 $FNAME (${SIZE_MB}MB 超过 Gitee ${MAX_SIZE_MB}MB 附件限制)"
              continue
            fi
            echo "上传 $FNAME (${SIZE_MB}MB)..."
            HTTP_CODE=$(curl -sS -w "%{http_code}" --max-time 600 \
              -X POST "$API/releases/$RELEASE_ID/attach_files" \
              -F "access_token=$GITEE_TOKEN" \
              -F "file=@$file" -o /tmp/gitee_upload_resp.txt)
            echo "  HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" -ge 400 ]; then
              echo "  上传失败，响应:"; cat /tmp/gitee_upload_resp.txt
            fi
          done
          echo "Sync to Gitee complete"

  # 同步到 GitCode：与 Gitee 并行，失败不影响整体流程，可手动同步
  sync-gitcode:
    if: ${{ !contains(github.ref, '-') }}
    needs: [ upload ]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Download
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Sync release to GitCode
        env:
          TAG: ${{ github.ref_name }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITCODE_OWNER: ${{ secrets.GITCODE_OWNER }}
          GITCODE_REPO: ${{ secrets.GITCODE_REPO }}
        run: |
          API="https://api.gitcode.com/api/v5/repos/$GITCODE_OWNER/$GITCODE_REPO"
          AUTH="Authorization: Bearer $GITCODE_TOKEN"

          # 1. 创建 Release（GitCode 不需要 tag 预先存在）
          echo "Creating GitCode release $TAG..."
          RESP=$(curl -sS -X POST "$API/releases" \
            -H "$AUTH" -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"$TAG\",\"name\":\"$TAG\",\"body\":\"ToWorld $TAG\",\"target_commitish\":\"main\"}")
          echo "Create: $(echo "$RESP" | head -c 200)"
          # 409 = 已存在，200/201 = 创建成功，都继续上传

          # 2. 上传附件（upload_url 直接用 tag 名）
          for file in dist/*; do
            [ -f "$file" ] || continue
            FNAME=$(basename "$file")
            ENC=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$FNAME")
            echo "Getting upload URL for $FNAME..."
            UPLOAD_INFO=$(curl -sS -H "$AUTH" "$API/releases/$TAG/upload_url?file_name=$ENC")
            UPLOAD_URL=$(echo "$UPLOAD_INFO" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('url',''))" 2>/dev/null)
            if [ -z "$UPLOAD_URL" ]; then
              echo "Failed to get upload URL for $FNAME, skipping"
              continue
            fi
            # 应用上传接口返回的请求头
            echo "$UPLOAD_INFO" | python3 -c 'import sys,json; d=json.load(sys.stdin); [print(f"{k}: {v}") for k,v in (d.get("headers") or {}).items()]' > /tmp/gitcode_headers.txt
            echo "Uploading $FNAME..."
            if [ -s /tmp/gitcode_headers.txt ]; then
              curl -sS -X PUT "$UPLOAD_URL" -H @/tmp/gitcode_headers.txt --data-binary "@$file" > /dev/null
            else
              curl -sS -X PUT "$UPLOAD_URL" --data-binary "@$file" > /dev/null
            fi
          done
          echo "Sync to GitCode complete"
