include: lint_options.yaml

analyzer:
  exclude:
    - build/**
    - lib/l10n/intl/**
    - lib/**/generated/**
    - plugins/**
    - lib/sdk/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    invalid_annotation_target: ignore
    # Vendored xboard SDK relies on non-abstract classes inheriting abstract members.
    non_abstract_class_inherits_abstract_member: ignore
